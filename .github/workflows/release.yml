name: Release

# Tag push -> signed, notarized macOS arm64 release + Linux x86_64 AppImage,
#             tar.gz, deb and Flatpak builds, all attached to one GitHub release,
#             then the Homebrew cask bump.
# Manual run  -> unsigned ad-hoc builds uploaded as CI artifacts, so the packaging
#                can be smoke-tested without touching certificates.
#
# Two published platforms, and only the mac one is signed: Gatekeeper has no Linux
# equivalent, and the cask is macOS-only, so the linux job touches neither.
#
# Three jobs: `linux` and `mac` build in parallel, `publish` waits for both. Making
# publication its own job is what lets the two builds overlap while still producing
# one `gh release create` — and a job that needs a failed job is skipped, so nothing
# is published unless both halves built *and* the Linux one launched what it built.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Runs alongside the mac job, and unlike it *runs* what it built — so a tag can
  # never publish a Linux artifact nobody launched. It is quick (~6 min against
  # notarization's 15–50), so overlapping the two costs the release only the
  # artifact round-trip `publish` now pays for the mac assets as well.
  linux:
    name: Build and verify (Linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Repeated from the mac job on purpose: the two run independently, and
      # finding out about a mismatched tag after a six-minute build is six
      # minutes wasted.
      - name: Check the tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag=${GITHUB_REF_NAME#v}
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      # One list of libraries for the sandbox and the runner, so they cannot drift.
      # A packaging job would not need any of them; running the app does.
      - name: Install the system libraries Electron needs
        run: ./scripts/linux-sandbox.sh libs

      # electron-builder's Flatpak target assembles a single-file bundle against
      # these pinned runtimes. The helper is shared with local sandbox builds so
      # CI and development cannot silently choose different runtime branches.
      - name: Install Flatpak build tools and runtimes
        run: ./scripts/linux-sandbox.sh flatpak-deps

      # A fresh checkout still has node-pty's darwin/win32 prebuilds, and the
      # `files` allowlist cannot drop them for one platform only — see the script.
      # Without this the linux artifact ships a Mach-O binary and a darwin
      # spawn-helper it can never load.
      - name: Drop the foreign prebuilds
        run: ./scripts/linux-sandbox.sh prebuilds .

      # The app is TypeScript compiled in place and the emitted .js/.mjs is
      # gitignored, so a fresh checkout has sources and no runnable app. Every
      # electron-builder call needs this first.
      - name: Compile the TypeScript sources
        run: npm run build

      - name: Build (x86_64)
        run: npx electron-builder --linux --x64

      # The artifact users download, driven for real: node-pty is asarUnpack'ed and
      # loaded by path, so a bundle can boot perfectly and still have no terminal.
      # Playwright is installed here rather than being a dependency — its
      # postinstall would otherwise download browser engines on every npm install.
      - name: Smoke-test the packaged build
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm install --no-save --no-audit --no-fund playwright
          xvfb-run -a node scripts/smoke.js --app dist --out smoke

      # A Flatpak can boot while every host process fails at the sandbox edge.
      # Install the actual bundle and use a controlled host-side Claude stub to
      # cover smart lookup and node-pty; --repo covers the host git bridge.
      - name: Smoke-test the installed Flatpak
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          # Uninstall first rather than --reinstall: for a single-file bundle
          # that flag does nothing, and installing over an existing app fails
          # with "already installed". An ephemeral runner never hits it, but a
          # re-run, a self-hosted runner and every local repeat of these same
          # steps do — and the local repeat is the documented way to check this.
          flatpak uninstall --user --noninteractive -y com.oglimmer.wisp || true
          flatpak install --user --noninteractive -y dist/*.flatpak
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/claude" <<'EOF'
          #!/bin/sh
          if [ "${1:-}" = "-p" ]; then
            printf '%s\n' '{"result":"{\"answer\":\"Flatpak host lookup works.\",\"sources\":[]}"}'
            exit 0
          fi
          printf 'Flatpak host terminal works.\r\n'
          while IFS= read -r _line; do :; done
          EOF
          chmod +x "$HOME/.local/bin/claude"
          PATH="$HOME/.local/bin:$PATH" dbus-run-session -- \
            xvfb-run -a node scripts/smoke.js \
              --flatpak com.oglimmer.wisp --repo --host-tools --out smoke-flatpak

      - name: Check the artifacts are there
        run: |
          ls -lh dist/*.AppImage dist/*.tar.gz dist/*.deb dist/*.flatpak
          for f in dist/*.deb; do
            dpkg-deb --info "$f" >/dev/null
            dpkg-deb --contents "$f" >/dev/null
          done
          # A truncated artifact is worse than a missing one: it uploads fine.
          for f in dist/*.AppImage dist/*.tar.gz dist/*.deb dist/*.flatpak; do
            size=$(stat -c %s "$f")
            if [ "$size" -lt 50000000 ]; then
              echo "::error::$f is only $size bytes — the build is incomplete"
              exit 1
            fi
          done

      # The screenshots are the only way to see what a headless failure looked like.
      - name: Upload smoke screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wisp-linux-smoke-screenshots
          path: |
            smoke/
            smoke-flatpak/
          if-no-files-found: ignore

      # Consumed by the publish job on a tag; on a manual run it is the dry-run
      # download.
      - name: Upload the linux build
        uses: actions/upload-artifact@v4
        with:
          name: wisp-linux-x64
          path: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.deb
            dist/*.flatpak

  mac:
    name: Build and sign (macOS arm64)
    runs-on: macos-15
    # `notarytool --wait` blocks until Apple answers, with no timeout of its own, so a
    # stuck submission would otherwise hold the runner for GitHub's 6-hour default.
    # Apple's own guidance is 15 minutes typical, up to an hour — and run 30223651206
    # genuinely took 53. Anything under 90 risks killing a submission that was fine.
    timeout-minutes: 90
    # Read by `publish`, which runs on Linux and so can determine neither on its own:
    # the version comes from the tag check below, and whether the build was signed
    # decides between a release and a labelled prerelease.
    outputs:
      version: ${{ steps.v.outputs.version }}
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Resolve version
        id: v
        run: |
          pkg=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag=${GITHUB_REF_NAME#v}
            if [ "$tag" != "$pkg" ]; then
              echo "::error::tag v$tag does not match package.json version $pkg"
              exit 1
            fi
          fi
          echo "version=$pkg" >> "$GITHUB_OUTPUT"

      - name: Check signing secrets
        id: signing
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Test each variable directly. This used to look them up indirectly with
          # `eval "value=\${$name}"`, which silently reported a secret as missing
          # whenever its value began with `#` — bash took the rest of the line as a
          # comment — and would have tried to *run* the tail of any value containing
          # a space. Never round-trip a secret through eval.
          missing=
          check() {
            if [ -n "$2" ]; then
              echo "$1: set"
            else
              echo "$1: MISSING"
              missing="$missing $1"
            fi
          }
          check MACOS_CERTIFICATE "$CERT"
          check APPLE_ID "$APPLE_ID"
          check APPLE_APP_SPECIFIC_PASSWORD "$APPLE_APP_SPECIFIC_PASSWORD"
          check APPLE_TEAM_ID "$APPLE_TEAM_ID"
          # Deliberately not required. Keychain Access lets you export a .p12 with no
          # password at all, and electron-builder handles that: an empty CSC_KEY_PASSWORD
          # is passed through to `security import` as "". Demanding a non-empty value here
          # would reject a perfectly valid identity.
          if [ -n "$CERT_PASSWORD" ]; then
            echo "MACOS_CERTIFICATE_PASSWORD: set"
          else
            echo "MACOS_CERTIFICATE_PASSWORD: empty (fine if the .p12 was exported without one)"
          fi
          if [ -n "$missing" ]; then
            echo "::warning::missing signing secrets:$missing — building unsigned (ad-hoc)"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      # Fail in seconds on the wrong certificate rather than after a four-minute build
      # and a round trip to Apple. electron-builder cannot be relied on to notice: when it
      # finds no "Developer ID Application" identity it falls back to any non-Apple one,
      # and its skip-list still names "Mac Developer:", the pre-Xcode-11 spelling — so an
      # "Apple Development:" certificate silently signs a build that notarization then
      # rejects with "not signed with a valid Developer ID certificate".
      - name: Verify the certificate is a Developer ID Application identity
        if: steps.signing.outputs.signed == 'true'
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          p12="$RUNNER_TEMP/verify.p12"
          keychain="$RUNNER_TEMP/verify.keychain-db"
          printf '%s' "$CERT" | base64 --decode > "$p12"
          security create-keychain -p "" "$keychain"
          security unlock-keychain -p "" "$keychain"
          security import "$p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          # Certificate names are embedded in every signed binary — not secret.
          identities=$(security find-identity -v -p codesigning "$keychain")
          echo "$identities"
          security delete-keychain "$keychain"
          rm -f "$p12"
          if ! printf '%s' "$identities" | grep -q "Developer ID Application:"; then
            echo "::error::MACOS_CERTIFICATE holds no 'Developer ID Application' identity — see docs/SIGNING.md step 2. An Apple Development certificate cannot notarize."
            exit 1
          fi

      # As in the linux job: the checkout holds .ts sources, not the app. Both
      # build variants below depend on this having run.
      - name: Compile the TypeScript sources
        run: npm run build

      - name: Build (signed + notarized)
        if: steps.signing.outputs.signed == 'true'
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --arm64

      - name: Build (unsigned, ad-hoc)
        if: steps.signing.outputs.signed != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx electron-builder --mac --arm64 \
            -c.mac.identity=- \
            -c.mac.notarize=false \
            -c.mac.hardenedRuntime=false

      - name: Inspect the built app
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          app="dist/mac-arm64/Wisp.app"
          plist="$app/Contents/Info.plist"
          # Handy for keeping the cask's `depends_on macos:` honest.
          echo "LSMinimumSystemVersion: $(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$plist")"
          codesign --verify --deep --strict --verbose=2 "$app"
          if [ "$SIGNED" = "true" ]; then
            spctl --assess --type execute --verbose=4 "$app"
            xcrun stapler validate "$app"
          fi

      # Unconditional now that publication is a separate job: on a tag `publish`
      # downloads this, on a manual run it is the dry-run download. The artifact
      # carries no signing status in its name — read the `signed` output for that,
      # since `publish` has to know the name before the job it comes from has run.
      - name: Upload the mac build
        uses: actions/upload-artifact@v4
        with:
          name: wisp-macos-arm64
          path: |
            dist/*.dmg
            dist/*.zip

  # The only job that writes anything outside the run, and it needs both builds —
  # so a failure in either skips it and the release is never half-populated. It
  # runs on Linux because everything here is `gh` and a regex: the mac-only checks
  # (codesign, spctl, stapler) already ran in the job that produced the .dmg, and
  # the bytes published are the ones that were verified there.
  publish:
    name: Publish release
    needs: [linux, mac]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # For the cask rewrite below only — this job installs no dependencies, so
      # pinning the version beats inheriting whatever the runner image ships.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Collect the mac build
        uses: actions/download-artifact@v4
        with:
          name: wisp-macos-arm64
          path: dist-mac

      - name: Collect the linux build
        uses: actions/download-artifact@v4
        with:
          name: wisp-linux-x64
          path: dist-linux

      # Found rather than named, for the same reason the linux assets are: the mac
      # build no longer sits in the directory electron-builder wrote it to, so its
      # layout here is upload-artifact's to decide. Resolving it once, up front,
      # also turns a wrong guess into an error before anything is published rather
      # than a release that went out with only half its assets.
      - name: Locate the mac assets
        run: |
          dmg=$(find dist-mac -type f -name '*.dmg' -print -quit)
          zip=$(find dist-mac -type f -name '*.zip' -print -quit)
          if [ -z "$dmg" ] || [ -z "$zip" ]; then
            echo "::error::the mac artifact holds no .dmg and/or no .zip"
            find dist-mac -type f
            exit 1
          fi
          echo "found: $dmg $zip"
          echo "DMG=$dmg" >> "$GITHUB_ENV"
          echo "ZIP=$zip" >> "$GITHUB_ENV"

      # electron-builder spells x64 differently per target (`x86_64` for AppImage),
      # so the linux assets are collected by find rather than named — a hardcoded
      # name would publish a mac-only release the day that spelling changes.
      - name: Publish release
        if: needs.mac.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.mac.outputs.version }}
        run: |
          set -- "$DMG" "$ZIP"
          while IFS= read -r f; do set -- "$@" "$f"; done \
            < <(find dist-linux -type f \( -name '*.AppImage' -o -name '*.tar.gz' \
              -o -name '*.deb' -o -name '*.flatpak' \))
          echo "publishing: $*"
          gh release create "$GITHUB_REF_NAME" \
            --title "Wisp $VERSION" \
            --generate-notes \
            "$@"

      # A tag built without signing secrets still publishes, but as a clearly
      # labelled prerelease — and the cask is deliberately NOT bumped, so
      # `brew install` never serves a build Gatekeeper will block.
      - name: Publish unsigned prerelease
        if: needs.mac.outputs.signed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.mac.outputs.version }}
        run: |
          set -- "$DMG" "$ZIP"
          while IFS= read -r f; do set -- "$@" "$f"; done \
            < <(find dist-linux -type f \( -name '*.AppImage' -o -name '*.tar.gz' \
              -o -name '*.deb' -o -name '*.flatpak' \))
          gh release create "$GITHUB_REF_NAME" \
            --title "Wisp $VERSION (unsigned test build)" \
            --prerelease \
            --notes 'Unsigned, un-notarized test build — no Apple signing secrets were
          configured when this tag was built. macOS will refuse to open it until you
          strip the download quarantine:

          ```
          xattr -dr com.apple.quarantine /Applications/Wisp.app
          ```

          `brew install --cask wisp` does **not** serve this build: the cask is only
          bumped for signed, notarized releases.

          The Linux x86_64 build attached here is unaffected — Apple signing does not
          apply to it, and it was launched and driven by the smoke test before upload.' \
            "$@"

      # The tag was built from a detached HEAD, so land the cask bump on the
      # default branch — that is the ref `brew tap` actually reads. The sha is
      # taken from the downloaded .dmg, which is the same file just uploaded to
      # the release — hash whatever was published, not whatever was built.
      - name: Bump Homebrew cask
        if: needs.mac.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.mac.outputs.version }}
        run: |
          SHA=$(sha256sum "$DMG" | cut -d' ' -f1)
          export SHA
          branch=$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name)
          git fetch origin "$branch"
          git checkout -B "$branch" "origin/$branch"
          node -e '
            const fs = require("fs");
            const file = "Casks/wisp.rb";
            let src = fs.readFileSync(file, "utf8");
            src = src.replace(/^(\s*version\s+)".*"$/m, `$1"${process.env.VERSION}"`);
            src = src.replace(/^(\s*sha256\s+)".*"$/m, `$1"${process.env.SHA}"`);
            fs.writeFileSync(file, src);
          '
          if git diff --quiet -- Casks/wisp.rb; then
            echo "cask already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "cask: wisp $VERSION" -- Casks/wisp.rb
          git push origin "$branch"
