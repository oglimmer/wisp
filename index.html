<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
    <title>Wisp</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Welcome screen shown until a base folder is chosen -->
    <div id="welcome" class="welcome">
      <div class="welcome-card">
        <h1>Wisp</h1>
        <p>Choose a base folder to open your notes.</p>
        <button id="welcome-open-btn">Open Folder…</button>
      </div>
    </div>

    <!-- Main workspace -->
    <div id="workspace" class="workspace hidden">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <span id="vault-name" class="vault-name" title="">Vault</span>
          <div class="sidebar-actions">
            <button id="new-file-btn" title="New file">＋</button>
            <button id="new-folder-btn" title="New folder">🗀</button>
            <button id="refresh-btn" title="Refresh">⟳</button>
            <button id="change-folder-btn" title="Change folder">⋯</button>
          </div>
        </div>
        <!-- Git bar: hidden entirely unless the vault is a repository -->
        <div id="git-bar" class="git-bar hidden">
          <span id="git-branch" class="git-branch" title=""></span>
          <span id="git-sync" class="git-sync"></span>
          <span id="git-dirty" class="git-dirty"></span>
          <div class="sidebar-actions">
            <button id="git-diff-btn" title="Changed files">◨</button>
            <button id="git-pull-btn" title="Pull">↓</button>
            <button id="git-push-btn" title="Commit &amp; push">↑</button>
          </div>
        </div>

        <div id="tree" class="tree"></div>

        <!-- Drag handle: resize the reminder list below -->
        <div id="divider-reminders" class="hdivider" title="Drag to resize"></div>

        <!-- Reminder list: everything pending, soonest first -->
        <section id="reminders" class="reminders">
          <div class="reminders-header">
            <span class="reminders-title">Reminders</span>
            <span id="reminder-count" class="reminder-count hidden"></span>
            <div class="sidebar-actions">
              <button id="new-reminder-btn" title="New reminder">＋</button>
            </div>
          </div>
          <div id="reminder-list" class="reminder-list"></div>
        </section>
      </aside>

      <!-- Drag handle to resize the sidebar / editor split -->
      <div id="divider" class="divider" title="Drag to resize"></div>

      <main class="editor-pane">
        <!-- Smart insert: jot a note, let Claude file it into the right place -->
        <div id="smart-insert" class="smart-insert">
          <textarea
            id="smart-input"
            class="smart-input"
            spellcheck="false"
            placeholder="Jot a note — Check previews where Claude will file it, Add applies it. Or ask a question and press Lookup."
          ></textarea>
          <div class="smart-bar">
            <button id="smart-check-btn" title="Preview where this note will be filed">Check</button>
            <button id="smart-add-btn" title="File this note into your vault">Add</button>
            <span id="smart-status" class="smart-status"></span>
            <button id="smart-lookup-btn" title="Answer this question from your notes">Lookup</button>
          </div>
        </div>

        <!-- Drag handle: resize the note box above -->
        <div id="divider-input" class="hdivider" title="Drag to resize"></div>

        <div id="smart-preview" class="smart-preview hidden"></div>

        <!-- Drag handle: resize the preview above (only shown with a preview) -->
        <div id="divider-preview" class="hdivider hidden" title="Drag to resize"></div>

        <div class="editor-header">
          <span id="current-file" class="current-file">No file open</span>
          <!-- Raw / editor / rendered switch, shown only for Markdown files; Diff is
               appended whenever the vault is a git repository. -->
          <div id="view-toggle" class="view-toggle hidden">
            <button id="view-raw-btn" class="view-btn active" title="Edit the raw source">Raw</button>
            <button id="view-wys-btn" class="view-btn" title="Edit formatted text (WYSIWYG)">Editor</button>
            <button id="view-md-btn" class="view-btn" title="Preview rendered Markdown">Preview</button>
            <button id="view-diff-btn" class="view-btn" title="Show this file's changes against git">Diff</button>
          </div>
          <!-- How the diff is drawn; only shown while the Diff view is up -->
          <div id="diff-mode-toggle" class="view-toggle diff-mode-toggle hidden">
            <button id="diff-visual-btn" class="view-btn" title="Side by side, with the changed words picked out">Visual</button>
            <button id="diff-raw-btn" class="view-btn" title="The unified patch, as git prints it">Raw</button>
          </div>
          <span id="status" class="status"></span>
        </div>

        <!-- Find / replace bar (⌘F / ⌘⌥F, Ctrl+F / Ctrl+H) -->
        <div id="find-bar" class="find-bar hidden">
          <div class="find-row">
            <input
              id="find-input"
              class="find-input"
              type="text"
              spellcheck="false"
              placeholder="Find"
            />
            <span id="find-count" class="find-count"></span>
            <button id="find-case-btn" class="find-icon" title="Match case">Aa</button>
            <button id="find-prev-btn" class="find-icon" title="Previous match (⇧⌘G / ⇧F3)">↑</button>
            <button id="find-next-btn" class="find-icon" title="Next match (⌘G / F3)">↓</button>
            <button id="find-close-btn" class="find-icon" title="Close (Esc)">✕</button>
          </div>
          <!-- Replace only edits the raw source, so it's shown on demand -->
          <div id="find-replace-row" class="find-row hidden">
            <input
              id="replace-input"
              class="find-input"
              type="text"
              spellcheck="false"
              placeholder="Replace"
            />
            <button id="replace-btn" title="Replace this match (↵)">Replace</button>
            <button id="replace-all-btn" title="Replace every match (⌘↵)">All</button>
          </div>
        </div>

        <!-- Positioning context for the find highlight layer, which has to sit
             directly behind the textarea. -->
        <div class="editor-stack">
          <!-- Search highlights for the raw view: a textarea can't hold markup, so
               matches are painted by an exactly-aligned mirror of its text. -->
          <div id="find-highlights" class="find-highlights hidden" aria-hidden="true"></div>
          <textarea
            id="editor"
            class="editor"
            spellcheck="false"
            placeholder="Select a file from the tree to start editing…"
            disabled
          ></textarea>
          <!-- WYSIWYG editor: edit formatted text directly; saved back as Markdown -->
          <div
            id="wysiwyg"
            class="rendered markdown-body wysiwyg hidden"
            contenteditable="true"
            spellcheck="false"
            data-placeholder="Select a file from the tree to start editing…"
          ></div>
          <!-- Rendered Markdown view; swapped in for the textarea in Preview mode -->
          <div id="rendered" class="rendered markdown-body hidden"></div>
          <!-- Diff view: this file's changes against git, read-only -->
          <div id="diff-view" class="diff-view hidden"></div>
          <!-- Image viewer: image files are shown, never edited as text -->
          <div id="image-view" class="image-view hidden">
            <img id="image-view-img" class="image-view-img" alt="" />
            <div id="image-view-meta" class="image-view-meta"></div>
          </div>
        </div>
      </main>
    </div>

    <script src="node_modules/marked/lib/marked.umd.js"></script>
    <script src="node_modules/turndown/lib/turndown.browser.umd.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
